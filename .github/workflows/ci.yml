name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

  push:
    branches: [develop]

  workflow_dispatch: {}

permissions:
  contents: write

jobs:

   update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Registrar la rama en el README
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          LINE="- Añadida feature: $BRANCH"
          grep -qxF -- "$LINE" README.md || echo "$LINE" >> README.md

      - name: Commit y push del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: registrar rama" || echo "Sin cambios que commitear"
          git push origin HEAD:${{ github.head_ref || github.ref_name }} || echo "Nada que subir"
          
  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Validar entorno de desarrollo
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CI: validación de desarrollo correcta ✅"
          } else {
            Write-Host "CI: validación fallida ❌"
            exit 1
          }
